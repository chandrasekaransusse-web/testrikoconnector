name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [ "work", "main", "master" ]

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish EXE
        run: |
          dotnet publish .\src\TallyConnectorApp\TallyConnectorApp.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true -o .\artifacts\publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tally-connector-win-x64
          path: artifacts/publish/
